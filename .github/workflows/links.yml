name: Links

# Checks every link in the docs (README, docs/, index.html) still resolves — see lychee.toml for
# what's in scope and what's deliberately excluded.
#
# Weekly rather than only on PRs, because link rot is not caused by commits: a Valve store page
# moves, a docs site restructures, and the repo that points at it is unchanged. Also on PRs that
# touch documentation, where a typo'd relative path is exactly the thing a human reviewer skims past.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "index.html"
      - "lychee.toml"
  schedule:
    - cron: "13 8 * * 1" # Mondays, 08:13 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # `.` with the include/exclude rules from the config; --no-progress keeps the log readable.
          args: --config lychee.toml --no-progress .
          fail: true
      # A failed scheduled run notifies the repo owner by email, which is the right weight for
      # "a link in the README moved" — no issue is filed for it, unlike the API contract check,
      # where the failure means the shipped app is actively broken for users.
